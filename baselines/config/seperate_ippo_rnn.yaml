# Weights & Biases configuration
WANDB_MODE: "online" # Change to "online" for logging and include appropriate ENTITY and PROJECT arguments
ENTITY: ""
PROJECT: ""
RUN_NAME: "RUN-Seperate-IPPO-RNN_Checkpointing_Enabled"  # Optional run name. Run files go to <OUTPUT_DIR or .>/<RUN_NAME>/<timestamp>_<wandb_run_id>/
OUTPUT_DIR: ""  # Optional artifact root. Run files go to <OUTPUT_DIR or .>/<RUN_NAME>/<timestamp>_<wandb_run_id>/

# Environment configuration

ENV_NAME: "Craftax-Coop-Symbolic" # Can be changed to "Craftax-Coop-Symbolic", "Craftax-Coop-Pixels", "Craftax-MA-Symbolic", "Craftax-MA-Pixels"
MAX_PASSIVE_MOBS: 105  # Maximum number of passive mobs allocated/spawnable
MAX_MELEE_MOBS: 40  # Maximum number of melee predator mobs allocated/spawnable
MAX_RANGED_MOBS: 0  # Maximum number of ranged predator mobs allocated/spawnable

DISABLE_REVIVE: false
REVIVING_COOLDOWN_STEPS: 50
ACTION_MASK_WHILE_DEAD: true

SHARED_REWARD: true
ENABLE_WARRIOR_TO_WARRIOR_TRADING: false #Set to true to allow warriors to trade with each other

TEAMMATE_ALIVE_BONUS: 0.05
ALL_TEAM_ALIVE_BONUS: 0.2
DEAD_SELF_PENALTY_WEIGHT: 0.2 #individual penalty - does not affect shared reward
ONE_TIME_DEATH_PENALTY_SHARED: 0.0
ONE_TIME_DEATH_PENALTY_INDIVIDUAL: 0.0
WARRIOR_MELEE_KILL_REWARD: 7.5
WARRIOR_PASSIVE_FOOD_GAIN: 1  # Food gained by a warrior when eating a killed passive mob
FORAGER_PASSIVE_FOOD_GAIN: 3  # Food gained by a forager when eating a killed passive mob
FORAGER_FOOD_CAPACITY: 27  # Maximum food capacity for foragers
FORAGER_TO_WARRIOR_FOOD_TRADE_REWARD: 1.0
FORAGER_TO_WARRIOR_DRINK_TRADE_REWARD: 1.0
FORAGER_TO_WARRIOR_FOOD_TRADE_REWARD: 1.0
FORAGER_TO_WARRIOR_DRINK_TRADE_REWARD: 1.0
WARRIOR_TO_WARRIOR_FOOD_TRADE_REWARD: 1.0
WARRIOR_TO_WARRIOR_DRINK_TRADE_REWARD: 1.0

SPREAD_NON_FORAGERS_ACROSS_ROOMS: false  # If true, warriors/miners on a team spawn in distinct rooms (lone room first, then rooms A/B, wrapping after 3)

ENABLE_AUTO_RESPAWNING: false
AUTO_RESPAWN_STEPS: 50
RESTRICT_AUTO_RESPAWNING_TO_SPAWN_ROOM: true

TRADE_RADIUS: 15
TRADE_RADIUS_SHAPE: "circle"  # "square" or "circle"

EARLY_EPISODE_CAP: 0             # Max episode length during early training (0 = disabled)
EARLY_EPISODE_CAP_UNTIL: 0       # Training update step until which the cap applies
GENERAL_EPISODE_CAP: 0           # Max episode length after early cap ends (0 = no cap: episodes end only when all agents die, or at the env limit of 100000 steps)
TERMINATE_ON_ANY_DEATH: false
TERMINATE_ON_ANY_DEATH_OFFSET: 800

NUM_TEAMS: 1
TEAM_COMPOSITION: [1, 1, 2]  # [FORAGER, FORAGER, WARRIOR] # Specialization values: FORAGER=1, WARRIOR=2, MINER=3
USE_REDUCED_ACTION_SPACE: true  # If true, use actions 0-24 plus team-local GIVE target actions

# Model parameters
ALG_NAME: "ippo-rnn"
GRU_HIDDEN_DIM: 512
FC_DIM_SIZE: 128
ACTIVATION: "tanh"

# ── Sequence model ──
# POLICY_ARCH: "gru" (default), "agalite", "gtrxl", or "mlp" (memoryless).
# The AG_* / GX_* blocks below are inert unless POLICY_ARCH selects them.
# Switch from the command line without editing this file, e.g.
#   python baselines/seperate_ippo_rnn.py --config_file seperate_ippo_rnn.yaml POLICY_ARCH=agalite
POLICY_ARCH: "gru"

# AGaLiTe policy hyperparameters (used only when POLICY_ARCH: "agalite").
# These are the paper's Craftax architecture -- Pramanik, Elelimy, Machado &
# White, "AGaLiTe: Approximate Gated Linear Transformers for Online RL", TMLR
# 10/2024, Table 4 (AGaLiTe column) + Section 5 "Craftax" -- which is also
# exactly what the authors' released config_pure/craftax/arelit.yaml runs.
# These are PER AGENT.  There is NO context window: the
# carry summarises the agent's whole episode at fixed size.
AG_N_LAYERS: 4       # L: GTrXL-style blocks
AG_D_MODEL: 128      # d: residual stream width
AG_D_HEAD: 64        # dh: per-head dim (independent of AG_D_MODEL)
AG_N_HEADS: 4        # attention heads
AG_D_FFC: 128        # FFN hidden width (the paper's config uses d, not 4*d)
AG_ETA: 8            # eta: feature-map factor -> key/query dim = eta*dh = 512.
                     #   AG_ETA: 4 is the paper's other value; it halves the carry.
AG_R: 2              # number of cosine terms in the low-rank state approximation.
                     #   This follows the AUTHORS' CODE, where r counts the
                     #   vectors; the paper's Algorithm 4 runs i = 0..r, i.e.
                     #   r + 1 vectors.  So AG_R: 2 IS the paper's r = 1.
AG_GRU_BIAS: 2.0     # b_g init for the two GTrXL gates per block
AG_RESET_ON_TERMINATE: true  # zero the recurrent state on an episode boundary
AG_OUT_DIM: null     # null -> the stack emits AG_D_MODEL (128), like the
                     #   reference.  Set 512 to project up to GRU_HIDDEN_DIM so
                     #   the actor / critic / aux heads see the GRU's width.
AG_EPS: 1.0e-5       # floor on the 2*r*(s.q) denominator
AG_STABLE_PHASE: true  # evaluate cos(w t) by folding the phase into [0, 2pi).
                     #   Identical in exact arithmetic, and float32-exact for
                     #   AG_R: 2 at the t ~ 4e6 a 2e9-step run reaches, where the
                     #   reference's cos(t*w) has lost the phase completely.
                     #   false = bit-for-bit reference behaviour.
# Memory note: the per-env carry is 26,625 floats vs the GRU's 512, so
# init_hstate is ~218 MB at NUM_ENVS: 512 x 4 agents (the GRU's is ~4 MB);
# scale linearly with the agent count, and
# it is held in a few copies during the PPO update.  AG_ETA: 4 halves it.

# GTrXL policy hyperparameters (used only when POLICY_ARCH: "gtrxl").
# These are the paper's "GTrXL-128" Craftax architecture -- Table 4, GTrXL
# column with memory size M = 128 -- i.e. the authors' released
# config_pure/craftax/gtrxl128.yaml.  PER AGENT.
GX_LAYER_NUM: 4        # L: GTrXL blocks
GX_EMBEDDING_DIM: 128  # d: residual stream width
GX_HEAD_DIM: 64        # d_h: per-head dim
GX_HEAD_NUM: 4         # attention heads
GX_MLP_NUM: 2          # Dense layers per block FFN (all d wide)
GX_MEMORY_LEN: 128     # M: cached hidden states PER LAYER. This is the "128" in
                       #   GTrXL-128, and the whole carry scales linearly with it.
                       #   Each layer attends M steps back, so the receptive
                       #   field compounds to ~L*M with depth.
GX_GRU_BIAS: 2.0       # b_g init for the two GRU gates per block
GX_RESET_ON_TERMINATE: true  # sever attention across an episode boundary
GX_OUT_DIM: null       # null -> the stack emits GX_EMBEDDING_DIM (128), like the
                       #   reference.  Set 512 to project up to GRU_HIDDEN_DIM.
# Memory note: the per-env carry is (L+1)*M*d + M = 82,048 floats -- 160x the
# GRU's 512 and ~3x AGaLiTe's 26,625.  At NUM_ENVS: 512 x 3 agents that is
# ~504 MB for init_hstate alone, held in a few copies during the PPO update.
# GX_MEMORY_LEN: 64 halves it (and gives the paper's other sweep point, 256,
# doubles it).
# Caveat: GTrXL's rollout (T=1) and its PPO recompute (T=NUM_STEPS) are not the
# same computation -- attention span depends on where the segment boundary
# falls.  Measured at this shape: hidden states differ by up to 3.5e-2, giving
# an epoch-0 importance ratio of 1 +/- 1.1e-4 (0.055% of CLIP_EPS; AGaLiTe is
# 4.8e-7, GRU is exactly 0).  Inherent to Transformer-XL segment recurrence and
# matches the reference. See "Recompute semantics" in baselines/gtrxl_policy.py.

# Training parameters
TOTAL_TIMESTEPS: 4000000000
NUM_ENVS: 512
NUM_STEPS: 64
NUM_MINIBATCHES: 8
UPDATE_EPOCHS: 4
GAE_LAMBDA: 0.8
GAMMA: 0.99
CLIP_EPS: 0.2
SCALE_CLIP_EPS: false
ENT_COEF: 0.01
VF_COEF: 0.5
AUX_COEF: 0.1
# Decoupled aux loss: each prediction = its weight x the mean of its x and y squared errors, terms summed.
# At AUX_COEF 0.1: self 0.05 per squared error, each teammate 0.025 (0.5x self); the self weight does not depend on the teammate toggle.
USE_SELF_AUXILIARY_LOSS: true
AUX_SELF_WEIGHT: 1.0
USE_TEAMMATE_AUXILIARY_LOSS: false
AUX_TEAMMATE_WEIGHT: 0.5  # weight of EACH teammate prediction (0.5x the self weight)
ANNEAL_LR: true
LR: 0.0002
MAX_GRAD_NORM: 1.0
LR_WARMUP: 0.0
REW_SHAPING_HORIZON: 1000000

# Pruning configuration (jaxpruner). Each agent's network is pruned independently, all at PRUNE_STEP, once.
SPARSE_ALG: "no_prune"  # "no_prune" (off), "magnitude", "random", "saliency", "global_magnitude" or "global_saliency"
SPARSITY: 0.9           # Fraction of each agent's weight-matrix entries to prune (biases are never pruned), in (0, 1)
PRUNE_STEP: 20000       # Training update step at which to prune; pruned weights then stay zero for the rest of training

# Seed configuration
NUM_SEEDS: 1 #careful with this > 1 - might break something in the logging code
SEED: 0

# Logging configuration
LOGGING_UPDATES_INTERVAL: 10000  # Number of updates between logging phases
LOGGING_NUM_CALLS: 64          # Number of logging_step calls per phase (64 x 1024 = 64k CSV rows)
LOGGING_STEPS_PER_CALL: 1024  # Number of env steps per logging_step call
LOGGING_THREADS: 1            # Number of env threads to log

# Video recording parameters
SAVE_ARENA_FRAMES: true       # Static terrain PNG per logged episode, independent of SAVE_VIDEO
SAVE_VIDEO: true             # Whether to record and save videos during logging
VIDEO_LENGTH: 1000  # Number of env steps per video (rollout continues from current state)
VIDEO_PIXEL_SIZE: 16  # Pixel size for rendering (7=agent, 16=medium, 64=large)
SAVE_HIDDEN_STATES: false     # Whether to save hidden state CSVs during logging (large files!)

# Checkpointing configuration
CHECKPOINTING: true             # Enable saving/resuming training checkpoints
CHECKPOINT_DIR: ""              # Empty -> <OUTPUT_DIR or .>/<RUN_NAME>/checkpoints (must stay stable across restarts)
CHECKPOINT_INTERVAL_BLOCKS: 1   # Save a checkpoint every N logging phases
CHECKPOINT_MAX_TO_KEEP: 3       # Number of recent checkpoints to retain
RESUME: "auto"                  # "auto" resumes if a checkpoint exists, true forces resume, false starts fresh
MAX_BLOCKS_THIS_RUN: 0          # >0 checkpoints and exits after this many logging phases this run (for wall-time limits)
STOP_AT_UPDATE: 0               # >0 ends training at this update (LR still anneals over the full NUM_UPDATES)
